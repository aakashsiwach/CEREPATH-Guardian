[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cerepath-guardian"
version = "0.1.0"
description = "An independent, policy-bounded reliability and code-repair supervisor for CEREPATH."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CEREPATH contributors" }]
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<10"]

[project.scripts]
cerepath-guardian = "guardian.cli:main"

[tool.setuptools.packages.find]
include = ["guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
